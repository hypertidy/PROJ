on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) PROJ ${{ matrix.config.proj }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows: static libproj and share/proj from Rtools, copied into inst/proj by
          # src/Makevars.ucrt. This is what CRAN ships, so the bundled copy MUST be active.
          - {os: windows-latest, r: 'release', proj: 'rtools'}
          # macOS: brew libproj (dynamic). Plain install uses the system data; a second
          # install below with PROJ_GDAL_DATA_COPY exercises the copy path CRAN uses.
          - {os: macos-latest,   r: 'release', proj: 'brew'}
          # Linux: PROJ built from source with cmake, at the newest release and at the
          # oldest version proj_factors() with a CRS supports.
          - {os: ubuntu-latest,  r: 'devel',   proj: '9.9.0', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', proj: '9.9.0'}
          - {os: ubuntu-latest,  r: 'release', proj: '8.2.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PROJ_NUMBER: ${{ matrix.config.proj }}

    # bash everywhere: the Windows default is PowerShell, where `R` is an
    # alias for Invoke-History and `R CMD INSTALL` never reaches R.exe
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install PROJ from source (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev sqlite3 libtiff-dev cmake libssl-dev
          wget -q https://download.osgeo.org/proj/proj-$PROJ_NUMBER.tar.gz
          tar zxf proj-$PROJ_NUMBER.tar.gz
          # PROJ < 9.2 predates GCC 13's <cstdint> cleanup and fails to compile
          # (std::int64_t not declared in proj_json_streaming_writer.hpp);
          # force the include for the whole build
          cmake -S proj-$PROJ_NUMBER -B proj-build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DBUILD_APPS=OFF \
                -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build proj-build -j"$(nproc)"
          sudo cmake --install proj-build
          sudo ldconfig
          rm -rf proj-$PROJ_NUMBER proj-$PROJ_NUMBER.tar.gz proj-build
          echo "PROJ_DATA_DIR=/usr/share/proj" >> "$GITHUB_ENV"

      - name: Install PROJ (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install proj pkg-config sqlite
          echo "PROJ_DATA_DIR=$(brew --prefix proj)/share/proj" >> "$GITHUB_ENV"

      # On Linux PROJ is already built and installed above; stop pak from
      # installing the package's SystemRequirements (libproj-dev + proj-data),
      # which would drop the distro's older proj.db over ours and leave the
      # library and database mismatched.
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: ${{ runner.os == 'Linux' && 'false' || 'true' }}
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: false

      # ---- bundled PROJ data: the three states R/zzz.R has to get right ----

      - name: Default install uses the system PROJ data (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          R CMD INSTALL .
          Rscript .github/scripts/check-proj-data.R system

      - name: Default install uses the Rtools copy in inst/proj (Windows)
        if: runner.os == 'Windows'
        run: |
          R CMD INSTALL .
          Rscript .github/scripts/check-proj-data.R bundled

      - name: PROJ_GDAL_DATA_COPY install bundles a usable copy (the CRAN macOS mechanism)
        if: runner.os != 'Windows'
        env:
          PROJ_GDAL_DATA_COPY: 1
          PROJ_LIB: ${{ env.PROJ_DATA_DIR }}
        run: |
          R CMD INSTALL .
          Rscript .github/scripts/check-proj-data.R bundled

      - name: --with-data-copy install of a stale proj.db is detected and ignored
        if: runner.os != 'Windows'
        run: |
          # fake a proj.db from "another PROJ installation" by stripping the layout
          # version metadata, which is what PROJ checks on first database access
          mkdir -p "$RUNNER_TEMP/stale-proj"
          cp "$PROJ_DATA_DIR"/* "$RUNNER_TEMP/stale-proj/" || true
          sqlite3 "$RUNNER_TEMP/stale-proj/proj.db" "DELETE FROM metadata WHERE key LIKE 'DATABASE.LAYOUT%'"
          R CMD INSTALL --configure-args="--with-data-copy=yes --with-proj-data=$RUNNER_TEMP/stale-proj" .
          Rscript .github/scripts/check-proj-data.R fallback

      - name: Stale proj.db dropped into inst/proj is detected and ignored (Windows)
        if: runner.os == 'Windows'
        run: |
          # Windows has no configure; overwrite the installed copy with a layout-less one.
          # sqlite3 CLI comes with Rtools.
          LIB=$(Rscript -e 'cat(system.file("proj", package = "PROJ"))')
          sqlite3 "$LIB/proj.db" "DELETE FROM metadata WHERE key LIKE 'DATABASE.LAYOUT%'"
          Rscript .github/scripts/check-proj-data.R fallback
